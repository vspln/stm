version: "3.8"

services:
  backend:
    build: ./server
    container_name: stm-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: always

  frontend:
    build: ./client
    container_name: stm-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
